<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SENTINEL AI — Urban Sensor Network Trustworthiness & FDI Detection</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Plotly.js for interactive time-series and correlation visualizations -->
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
</head>
<body class="theme-dark">
  <div id="app" class="app-container">
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo">🛡️</div>
        <div class="brand-info">
          <h2>SENTINEL AI</h2>
          <span>Sensor Trust & Intrusion Detection</span>
        </div>
      </div>
      <nav class="nav-menu">
        <a href="#overview" class="nav-item active" data-tab="overview">Overview</a>
        <a href="#monitoring" class="nav-item" data-tab="monitoring">Sensor Monitoring</a>
        <a href="#detection" class="nav-item" data-tab="detection">Anomaly Detection</a>
        <a href="#simulation" class="nav-item" data-tab="simulation">Attack Simulator</a>
        <a href="#trust" class="nav-item" data-tab="trust">Trust Engine</a>
        <a href="#network" class="nav-item" data-tab="network">Network Topology</a>
        <a href="#evaluation" class="nav-item" data-tab="evaluation">Model Evaluation</a>
      </nav>
      <div class="system-status">
        <div class="status-indicator online"></div>
        <span>Backend: <strong id="backend-status">Connecting...</strong></span>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <header class="top-header">
        <div class="header-title">
          <h1 id="page-title">Network Trust Overview</h1>
          <p id="page-subtitle">Real-time SCADA telemetry monitoring, consistency verification & FDI defense</p>
        </div>
        <div class="header-controls">
          <div class="dataset-selector">
            <label for="active-dataset">Active Dataset:</label>
            <select id="active-dataset">
              <option value="batadal" selected>BATADAL (C-Town Water Network)</option>
              <option value="hai">HAI ICS Testbed (Secondary)</option>
            </select>
          </div>
          <button id="refresh-data-btn" class="btn btn-secondary">Refresh</button>
        </div>
      </header>

      <!-- Dynamic Tab Panes -->
      <section id="content-pane" class="content-pane">
        <!-- Dashboard views populated dynamically by frontend scripts -->
        <div id="overview-view" class="view-panel active"></div>
        <div id="monitoring-view" class="view-panel"></div>
        <div id="detection-view" class="view-panel"></div>
        <div id="simulation-view" class="view-panel"></div>
        <div id="trust-view" class="view-panel"></div>
        <div id="network-view" class="view-panel"></div>
        <div id="evaluation-view" class="view-panel"></div>
      </section>
    </main>
  </div>

  <script src="js/charts.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/simulation.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
